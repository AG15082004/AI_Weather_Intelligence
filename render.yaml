services:
  # Frontend Static Site
  - type: web
    name: ai-weather-intelligence-1
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-weather-intelligence.onrender.com

  # Backend Web Service (Docker)
  - type: web
    name: tn-weather-api-docker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FABRIC_SERVER
        sync: false
      - key: FABRIC_DATABASE
        value: lh_tn_weather_intelligence
      - key: FABRIC_AUTH_MODE
        value: service_principal
      - key: FABRIC_TENANT_ID
        sync: false
      - key: FABRIC_CLIENT_ID
        sync: false
      - key: FABRIC_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-weather-intelligence-1.onrender.com
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
